<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>REGION TEST</title>
<style>
  html, body { margin: 0; background: #0b1208; color: #e8f0dd;
               font: 12px/1.4 system-ui, "Microsoft YaHei", sans-serif; }
  #wrap { position: relative; width: 1280px; height: 720px; }
  #wrap canvas { display: block; }
  .lab {
    position: absolute; left: 10px; padding: 4px 10px;
    background: rgba(0, 0, 0, .55); border: 1px solid rgba(255, 208, 74, .5);
    border-radius: 8px; color: #ffe887; font-weight: 700; font-size: 14px;
    white-space: nowrap;
  }
  .lab small { display: block; font-weight: 400; font-size: 10px; color: #cfe0bf; }
  #status { padding: 8px 12px 20px; font: 11px/1.5 Consolas, monospace;
            white-space: pre; color: #b8cfa2; }
</style>
</head>
<body>
<div id="wrap"></div>
<pre id="status">running…</pre>
<script src="./vendor/three.min.js"></script>
<script src="./js/config.js"></script>
<script src="./js/Art.js"></script>
<script src="./js/World.js"></script>
<script src="./js/Player.js"></script>
<script>
/* 内部验收页：把 4 个难度区的"配色 + 专属摆件"一次性渲染成 2×2 对照图。

   为什么要单独做这个页？
     游戏里换区是靠 World._stepPalette 每帧插值的（k = 1-exp(-1.1*dt)），
     要 1~2 秒真实帧数才收敛。无头 Chrome 的 --virtual-time-budget 只跑得出
     一两帧，所以截图里永远是第 1 区的颜色 —— 看不到换区效果。
     这里直接 snap 到目标调色板再渲染，验证的是"目标配色本身对不对"。

   不参与游戏运行，也不进交付包。 */
(function () {
  var CFG = window.RR.CFG;
  var W = 1280, H = 720;
  var QW = W / 2, QH = H / 2;

  var errors = [];
  // 出错要立刻吐到页面上：否则 IIFE 中途抛异常，收尾的统计永远不执行，
  // 页面只会停在 "running…"，白白浪费一轮排查。
  function flush(msg) {
    var el = document.getElementById('status');
    if (el) el.textContent = msg;
  }
  window.onerror = function (m, s, l) {
    errors.push(m + ' @' + l);
    document.title = 'RESULT=ERROR';
    flush('ERROR ary=' + errors.join(' | '));
    return false;
  };

  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(1);
  if (typeof THREE.sRGBEncoding !== 'undefined') renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.setScissorTest(true);
  document.getElementById('wrap').appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  var world = new RR.World(scene);

  // 相机照抄游戏：跟在熊背后朝 -Z 看
  var cam = world.camera;
  cam.aspect = QW / QH;
  cam.updateProjectionMatrix();
  cam.position.set(0, 3.1, 5.9);
  cam.lookAt(new THREE.Vector3(0, 1.3, -9));

  // 站一只熊进去，好判断"人和地面是不是分得开"
  var bear = new RR.Player(scene, 'xiong2');
  var i;
  for (i = 0; i < 40; i++) bear.update(1 / 60, 11);

  // ---- 把每个区的摆件摆到镜头前面（默认全藏在 z 轴远端）----
  function placeDecor(idx, on) {
    var list = (world.regionDecor && world.regionDecor[idx]) || [];
    for (var i = 0; i < list.length; i++) {
      var o = list[i];
      // 前 4 个摆到 z=-14/-24/-34/-46，剩下的推到很远
      if (i < 4) {
        o.position.set(o.position.x, 0, -14 - i * 10);
        o.visible = on;
      } else {
        o.position.set(o.position.x, 0, -300 - i * 20);
        o.visible = false;
      }
    }
  }

  function snapRegion(k) {
    world.stageIndex = k;
    world._palCur = world._resolvePalette(k);
    world._palGoal = world._resolvePalette(k);
    world._applyPalette(world._palCur);
    for (var idx = 1; idx <= 3; idx++) placeDecor(idx, idx === k);
  }

  var lines = [];
  var stages = CFG.DIFFICULTY;
  var quads = [
    { k: 0, x: 0, y: QH },        // 左上（GL 原点在左下）
    { k: 1, x: QW, y: QH },       // 右上
    { k: 2, x: 0, y: 0 },         // 左下
    { k: 3, x: QW, y: 0 }         // 右下
  ];

  var wrap = document.getElementById('wrap');

  for (i = 0; i < quads.length; i++) {
    var q = quads[i];
    snapRegion(q.k);

    renderer.setViewport(q.x, q.y, QW, QH);
    renderer.setScissor(q.x, q.y, QW, QH);
    renderer.render(scene, cam);

    var p = world._palCur;
    var dec = world.regionDecor[q.k] ? world.regionDecor[q.k].length : 0;

    var lab = document.createElement('div');
    lab.className = 'lab';
    lab.style.left = (q.x + 10) + 'px';
    lab.style.top = (H - q.y - QH + 10) + 'px';
    lab.innerHTML = '第 ' + (q.k + 1) + ' 区 · ' + stages[q.k].name +
      '<small>at=' + stages[q.k].at + 'm  ' + stages[q.k].sub + '</small>';
    wrap.appendChild(lab);

    lines.push(
      'region ' + (q.k + 1) +
      '  fog=' + p.fog.getHexString() +
      ' road=' + p.road.getHexString() +
      ' grass=' + p.grass.getHexString() +
      ' grassDark=' + p.grassDark.getHexString() +
      ' hemi=' + p.hemi.toFixed(2) +
      ' sun=' + p.sun.getHexString() + '@' + p.sunIntensity.toFixed(2) +
      ' fogNear/Far=' + p.near + '/' + p.far +
      '  decorObj=' + dec
    );
  }

  // 4 个区的配色两两不同，否则说明 STAGE_PALETTE 有重复项
  var dup = [];
  for (i = 0; i < quads.length; i++) {
    for (var j = i + 1; j < quads.length; j++) {
      var a = CFG.STAGE_PALETTE[quads[i].k], b = CFG.STAGE_PALETTE[quads[j].k];
      if (a.fog === b.fog && a.road === b.road && a.grass === b.grass) {
        dup.push((quads[i].k + 1) + '≡' + (quads[j].k + 1));
      }
    }
  }

  var ok = errors.length === 0 && dup.length === 0;
  lines.push('');
  lines.push('配色重复区对 = ' + (dup.length ? dup.join(' ') : 'none'));
  lines.push('errors       = ' + (errors.length ? errors.join(' | ') : 'none'));
  lines.push('RESULT=' + (ok ? 'OK' : 'CHECK'));

  document.getElementById('status').textContent = lines.join('\n');
  document.title = 'RESULT=' + (ok ? 'OK' : 'CHECK') + ' regions=' + quads.length;
  window.__regionTest = { lines: lines, errors: errors, dup: dup };
})();
</script>
</body>
</html>
