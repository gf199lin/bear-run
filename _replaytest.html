<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>回放判定统计（不入交付包）</title>
</head>
<body>
<pre id="status">RUNNING</pre>
<pre id="out"></pre>

<script src="./js/config.js"></script>
<script src="./js/InputSource.js"></script>
<script src="./_radarreplay/radar-action-1020.js"></script>
<script>
// 用游戏真实的 ReplayRadarInputSource + RadarDecoder，把整段回放同步跑完，
// 统计四个动作事件的检出情况，并与 labels 真值逐帧比对（tol = ±0.45s ≈ ±3.5 帧）。
(function () {
  var status = document.getElementById('status');
  var out = document.getElementById('out');
  var lines = [];
  function log(s) { lines.push(s); out.textContent = lines.join('\n'); }

  var data = window.RR_RADAR_REPLAY;
  if (!data) { status.textContent = 'FAIL: 回放数据未加载'; return; }

  var names = Object.keys(data.series);
  var sname = names[0];
  var ser = data.series[sname];
  var n = ser.frames;
  var FPS = ser.rate;
  var TOL = 0.45;                       // 秒，对齐组员 compare-all 的容忍度
  var TOLF = Math.round(TOL * FPS);     // 帧

  log('series=' + names.join(', ') + '  frames=' + n + '  rate=' + FPS.toFixed(3) + 'Hz');
  log('');

  // ---- 真值事件帧 ----
  function edges(arr) {                  // 0->1 上升沿帧号
    var e = [];
    for (var i = 1; i < n; i++) if (arr[i] && !arr[i - 1]) e.push(i);
    if (arr[0]) e.unshift(0);
    return e;
  }
  var truth = {
    jump: ser.truth ? edges(ser.truth.jump) : [],
    crouch: ser.truth ? edges(ser.truth.crouch) : [],
    lane: []
  };
  for (var i = 1; i < n; i++) if (ser.truth && ser.truth.x[i] !== ser.truth.x[i - 1]) truth.lane.push(i);
  log('真值事件帧：jump=' + JSON.stringify(truth.jump));
  log('            crouch=' + JSON.stringify(truth.crouch));
  log('            lane=' + JSON.stringify(truth.lane));
  log('');

  // ---- 跑一遍回放 ----
  function run(mode, k, useSeries) {
    var CFG = window.RR.CFG.RADAR;
    var src = new window.RR.ReplayRadarInputSource({
      url: '', series: useSeries, k: k, speed: 1, loop: false, window: 40, mode: mode
    });
    src.attach();                       // 数据已在 window 上，直接 _ready()
    var ev = [];                        // {t:'jump'|'slide'|'left'|'right', frame:i}
    src.onEvent = function (type) { ev.push({ t: type, frame: src._idx }); };

    var dt = 1000 / 60, guard = 0;
    while (!src.stats.end && guard++ < 60000) src.update(dt);

    var jf = ev.filter(function (e) { return e.t === 'jump'; }).map(function (e) { return e.frame; });
    var sf = ev.filter(function (e) { return e.t === 'slide'; }).map(function (e) { return e.frame; });
    var lf = ev.filter(function (e) { return e.t === 'left'; }).map(function (e) { return e.frame; });
    var rf = ev.filter(function (e) { return e.t === 'right'; }).map(function (e) { return e.frame; });

    function score(det, tr) {           // 命中/漏报/误报（±TOLF 帧内算命中）
      var hit = 0, miss = 0, fp = 0;
      var used = {};
      for (var a = 0; a < tr.length; a++) {
        var ok = false;
        for (var b = 0; b < det.length; b++) {
          if (!used[b] && Math.abs(det[b] - tr[a]) <= TOLF) { ok = true; used[b] = 1; break; }
        }
        if (ok) hit++; else miss++;
      }
      for (var c = 0; c < det.length; c++) if (!used[c]) fp++;
      return { hit: hit, miss: miss, fp: fp, n: tr.length };
    }
    var J = score(jf, truth.jump), C = score(sf, truth.crouch);

    return {
      series: useSeries, mode: mode, k: k, frames: src.stats.frames, jump: jf.length, slide: sf.length,
      left: lf.length, right: rf.length, zmax: +src.stats.zmax.toFixed(1),
      hitJ: J.hit, missJ: J.miss, fpJ: J.fp, hitC: C.hit, missC: C.miss, fpC: C.fp,
      laneHit: score(lf.concat(rf), truth.lane).hit, laneFp: score(lf.concat(rf), truth.lane).fp
    };
  }

  var rows = [];
  names.forEach(function (sn) {
    rows.push(run('truth', 3.2, sn));
    [1.5, 2.0, 2.5, 3.2, 4.0].forEach(function (k) { rows.push(run('energy', k, sn)); });
  });

  log('series             mode    k    zmax | 跳:命中/漏/误  蹲:命中/漏/误  道:命中/误');
  rows.forEach(function (r) {
    log([r.series.padEnd(18), (r.mode === 'truth' ? 'truth ' : 'energy'),
         String(r.k).padEnd(4), String(r.zmax).padEnd(5),
         '|', (r.hitJ + '/' + r.missJ + '/' + r.fpJ).padEnd(13),
         (r.hitC + '/' + r.missC + '/' + r.fpC).padEnd(14),
         r.laneHit + '/' + r.laneFp].join(' '));
  });
  log('');
  log('真值合计：跳 7 次、蹲 7 次、换道 3 次（tol=±' + TOLF + ' 帧 = ±' + TOL + 's）');
  status.textContent = 'RESULT=OK';
})();
</script>
</body>
</html>
