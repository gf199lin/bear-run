<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>角色对比 · 内部验收</title>
<style>
  html, body { margin: 0; background: #0d1a0a; }
  #stage { position: relative; width: 960px; height: 520px; margin: 0 auto; }
  #stage canvas { display: block; }
  .tag {
    position: absolute;
    bottom: 12px;
    transform: translateX(-50%);
    color: #f5c332;
    font: 700 19px/1 system-ui, "Microsoft YaHei", sans-serif;
    letter-spacing: 5px;
    text-shadow: 0 2px 8px #000;
  }
  .tag small { display: block; margin-top: 6px; font-size: 11px; letter-spacing: 1px; color: #cfe0bf; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="./vendor/three.min.js"></script>
<script src="./js/config.js"></script>
<script src="./js/Art.js"></script>
<script src="./js/Player.js"></script>
<script>
/* 内部验收页：把两个角色并排放在同样的灯光与相机下，方便肉眼比对形象差异。
   不参与游戏运行，也不进交付包。 */
(function () {
  var CFG = window.RR.CFG;
  var C = CFG.COLORS;
  var W = 960, H = 520;

  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(1);
  if (typeof THREE.sRGBEncoding !== 'undefined') renderer.outputEncoding = THREE.sRGBEncoding;
  document.getElementById('stage').appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(C.fog);
  scene.fog = new THREE.Fog(C.fog, 70, 205);

  scene.add(new THREE.HemisphereLight(0xd8ecff, 0x8d8459, 0.5));
  var sun = new THREE.DirectionalLight(C.sun, 0.55);
  sun.position.set(-6, 10, 6);
  scene.add(sun);
  var fill = new THREE.DirectionalLight(0xcfe4ff, 0.12);
  fill.position.set(7, 6, -5);
  scene.add(fill);
  scene.add(new THREE.AmbientLight(0x9a9070, 0.26));

  var ids = ['xiong2', 'xiong1'];
  var xs = [-1.28, 1.28];
  var bears = [];

  for (var i = 0; i < ids.length; i++) {
    var p = new RR.Player(scene, ids[i]);
    p.root.position.set(xs[i], 0, 0);
    bears.push(p);
  }

  var cam = new THREE.PerspectiveCamera(34, W / H, 0.1, 300);
  cam.position.set(0, 1.5, -5.0);
  cam.lookAt(0, 0.95, 0);

  var stage = document.getElementById('stage');
  // 相机在 -Z 一侧朝 +Z 看，所以世界 +X 落在画面左边、-X 落在右边。
  // ids/xs = [xiong2(-1.28), xiong1(+1.28)]，映射到画面就是"熊大在左、熊二在右"。
  var pcts = [71, 29];
  var lines = [];
  for (var k = 0; k < ids.length; k++) {
    var spec = CFG.getCharacter(ids[k]);
    var d = document.createElement('div');
    d.className = 'tag';
    d.innerHTML = spec.name + '<small>' + spec.tagline + '</small>';
    d.style.left = pcts[k] + '%';
    stage.appendChild(d);

    lines.push(spec.id + '  毛色=' + spec.fur.toString(16) +
      ' 整体=' + spec.scale +
      ' 脸: 眼=' + spec.face.eye + ' 嘴=' + spec.face.mouth +
      ' 呆毛=' + spec.face.tuft + ' 眉=' + spec.face.brow +
      ' 眉宽=' + spec.browW + ' 腮红=' + spec.hasBlush +
      ' | 身架: 腿=' + spec.build.leg + ' 肚=' + spec.build.torso +
      ' 头=' + spec.build.head + ' 四肢=' + spec.build.limb +
      ' | 动作: 跳=' + spec.anim.jump + ' 滑=' + spec.anim.slide +
      ' 摆幅=' + spec.anim.runSwing);
  }
  var st = document.createElement('div');
  st.id = 'status';
  st.style.cssText = 'color:#cfe0bf;font:11px/1.6 Consolas,monospace;white-space:pre;padding:6px 14px';
  var box = new THREE.Box3();
  lines.unshift('相机在角色正面（游戏里看到的是背面，这一页专门核对五官）');
  for (var q = 0; q < bears.length; q++) {
    scene.updateMatrixWorld(true);
    box.setFromObject(bears[q].root);
    lines.push('  ' + ids[q] + ' rootY=0 视觉高度=' + (box.max.y - box.min.y).toFixed(3) +
      ' 判定盒=' + bears[q].bottom.toFixed(2) + '~' + bears[q].top.toFixed(2));
  }
  st.textContent = lines.join('\n');
  document.body.appendChild(st);

  renderer.render(scene, cam);

  // 供无头截图判断"渲染完成"
  window.__charDemo = { ids: ids, bears: bears.length, rendered: true };
  document.title = 'READY · 角色对比';
})();
</script>
</body>
</html>
