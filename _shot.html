<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>pose shot</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<script src="./vendor/three.min.js"></script>
<script src="./js/config.js"></script>
<script src="./js/Art.js"></script>
<script src="./js/Player.js"></script>
<script>
(function () {
  var A = RR.Art, CFG = RR.CFG, C = CFG.COLORS;
  var q = location.search.match(/pose=(\w+)/);
  var pose = q ? q[1] : 'run';

  var W = 1280, H = 720;
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(1);
  document.body.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(C.fog);
  scene.fog = new THREE.Fog(C.fog, 70, 205);

  // 与 World.js 完全一致的光照
  scene.add(new THREE.HemisphereLight(0xd8ecff, 0x7aa84e, 0.5));
  var sun = new THREE.DirectionalLight(C.sun, 0.55);
  sun.position.set(-14, 22, -8);
  scene.add(sun);
  var fill = new THREE.DirectionalLight(0xcfe4ff, 0.12);
  fill.position.set(12, 9, 14);
  scene.add(fill);
  scene.add(new THREE.AmbientLight(0x8f9c72, 0.25));

  scene.add(A.makeSky());

  for (var i = 0; i < 5; i++) {
    var t = A.makeGroundTile(12);
    t.position.z = -i * 12;
    scene.add(t);
  }

  var low = A.makeLowBarrier();
  low.position.set(-2.15, 0, -8);
  scene.add(low);

  var high = A.makeHighBarrier();
  high.position.set(2.15, 0, -8);
  scene.add(high);

  var block = A.makeRubbleBlock();
  block.position.set(0, 0, -16);
  scene.add(block);

  var coin = A.makeCoin();
  coin.position.set(0, 1.05, -4.5);
  scene.add(coin);

  var tree = A.makeRandomProp();
  tree.position.set(-7.5, 0, -9);
  scene.add(tree);

  var p = new RR.Player(scene);

  function sim(steps, speed) {
    for (var k = 0; k < steps; k++) p.update(1 / 60, speed);
  }

  var camPos = new THREE.Vector3(-1.7, 1.5, -2.7);
  var camLook = new THREE.Vector3(0, 0.95, 0);
  var fov = 52;

  if (pose === 'runback') {
    sim(70, 13);
    camPos.set(0, 3.1, 5.9); camLook.set(0, 1.3, 0); fov = 60;
  } else if (pose === 'jump') {
    p.jump();
    for (var a = 0; a < 60; a++) { sim(1, 13); if (p.jumpTime >= 0.30) break; }
    camPos.set(3.4, 2.0, 0.2); camLook.set(0, 1.1, 0); fov = 50;
  } else if (pose === 'jumpback') {
    p.jump();
    for (var b = 0; b < 60; b++) { sim(1, 13); if (p.jumpTime >= 0.30) break; }
    camPos.set(0, 3.1, 5.9); camLook.set(0, 1.6, 0); fov = 60;
  } else if (pose === 'land') {
    p.jump();
    for (var m = 0; m < 400; m++) { sim(1, 13); if (p.squash > 0.55) break; }
    camPos.set(-1.7, 1.2, -2.6); camLook.set(0, 0.7, 0);
  } else if (pose === 'slidedown') {
    p.slide();
    sim(30, 13);
    camPos.set(2.4, 1.0, -2.4); camLook.set(0, 0.4, -0.3); fov = 55;
  } else if (pose === 'slide') {
    p.slide();
    sim(30, 13);
    camPos.set(-2.4, 1.5, -2.6); camLook.set(0, 0.45, -0.3); fov = 55;
  } else {
    sim(70, 13);
  }

  var cam = new THREE.PerspectiveCamera(fov, W / H, 0.1, 600);
  cam.position.copy(camPos);
  cam.lookAt(camLook);
  renderer.render(scene, cam);

  document.title = 'pose=' + pose + ' y=' + p.y.toFixed(2) +
    ' ball=' + p.ballT.toFixed(2) + ' squash=' + p.squash.toFixed(2) +
    ' rotX=' + p.body.rotation.x.toFixed(2) +
    ' bodyY=' + p.body.position.y.toFixed(2) +
    ' scaleY=' + p.body.scale.y.toFixed(2);
})();
</script>
</body>
</html>
