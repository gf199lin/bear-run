<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>vick shot</title>
<style>
html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}
#info{position:fixed;left:8px;top:8px;z-index:9;color:#000;background:rgba(255,255,255,.82);
font:13px/1.5 Consolas,monospace;padding:6px 8px;white-space:pre;pointer-events:none}
</style>
</head>
<body>
<div id="info">booting</div>
<script src="./vendor/three.min.js"></script>
<script src="./js/config.js"></script>
<script src="./js/Art.js"></script>
<script src="./js/Player.js"></script>
<script src="./js/Vick.js"></script>
<script>
(function () {
  var A = RR.Art, CFG = RR.CFG, C = CFG.COLORS;
  var q = location.search.match(/scene=(\w+)/);
  var sceneId = q ? q[1] : 'chase';

  var W = 1280, H = 720;
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(1);
  if (typeof THREE.sRGBEncoding !== 'undefined') renderer.outputEncoding = THREE.sRGBEncoding;
  document.body.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(C.fog);
  scene.fog = new THREE.Fog(C.fog, 70, 205);

  scene.add(new THREE.HemisphereLight(0xd8ecff, 0x8d8459, 0.5));
  var sun = new THREE.DirectionalLight(C.sun, 0.55);
  sun.position.set(-14, 22, -8);
  scene.add(sun);
  var fill = new THREE.DirectionalLight(0xcfe4ff, 0.12);
  fill.position.set(12, 9, 14);
  scene.add(fill);
  scene.add(new THREE.AmbientLight(0x9a9070, 0.26));

  scene.add(A.makeSky());

  for (var i = 0; i < 6; i++) {
    var t = A.makeGroundTile(12);
    t.position.z = -i * 12 + 12;
    scene.add(t);
  }

  var player = new RR.Player(scene);
  var vick = new RR.Vick(scene);

  var camPos = new THREE.Vector3();
  var camLook = new THREE.Vector3();
  var fov = 64;

  function step(n, speed) {
    for (var k = 0; k < n; k++) {
      player.update(1 / 60, speed);
      vick.update(1 / 60, speed, player);
    }
  }

  var probeLog = [];
  if (sceneId === 'probe') {
    vick.beginChase();
    step(60, 13);
    probeLog.push('after run 60f: armR=' + vick.armR.rotation.x);
    vick.startExecution();
    player.die();
    var bad = -1, last = '';
    for (var f = 0; f < 300; f++) {
      player.update(1 / 60, 0);
      vick.update(1 / 60, 0, player);
      var v = vick.armR.rotation.x;
      if (bad < 0 && !isFinite(v)) { bad = f; }
      if (f % 10 === 0 || f === bad) {
        last = 'f' + f + ' st=' + vick.state + ' t=' + vick.t.toFixed(3) +
          ' armR=' + v + ' armL=' + vick.armL.rotation.x +
          ' bodyRX=' + vick.body.rotation.x + ' legL=' + vick.legL.rotation.x;
        probeLog.push(last);
      }
      if (bad >= 0 && f > bad + 3) break;
    }
    probeLog.push('FIRST NaN FRAME = ' + bad);
    camPos.set(player.x + CFG.CINE.offsetX, CFG.CINE.offsetY, CFG.CINE.offsetZ);
    camLook.set(player.x + CFG.CINE.lookX, CFG.CINE.lookY, CFG.CINE.lookZ);
  } else if (sceneId === 'face') {
    vick.beginChase();
    step(150, 13);
    vick.root.position.set(0, 0, -1.2);
    camPos.set(0.45, 1.70, -3.05); camLook.set(0, 1.54, -1.2); fov = 30;
  } else if (sceneId === 'front') {
    vick.beginChase();
    step(150, 13);
    vick.root.position.set(0, 0, -1.2);
    camPos.set(0.55, 1.5, -4.4); camLook.set(0, 1.05, -1.2); fov = 40;
  } else if (sceneId === 'exec') {
    vick.beginChase();
    step(260, 13);
    vick.startExecution();
    player.die();
    step(30, 0);
    player.smash();
    step(120, 0);
    camPos.set(player.x + CFG.CINE.offsetX, CFG.CINE.offsetY, CFG.CINE.offsetZ);
    camLook.set(player.x + CFG.CINE.lookX, CFG.CINE.lookY, CFG.CINE.lookZ);
    fov = 64;
  } else if (sceneId === 'raise') {
    vick.beginChase();
    step(260, 13);
    vick.startExecution();
    player.die();
    step(46, 0);
    camPos.set(player.x + CFG.CINE.offsetX, CFG.CINE.offsetY, CFG.CINE.offsetZ);
    camLook.set(player.x + CFG.CINE.lookX, CFG.CINE.lookY, CFG.CINE.lookZ);
    fov = 64;
  } else if (sceneId === 'fall') {
    vick.beginChase();
    step(215, 13);
    camPos.set(0, 3.1, 5.9); camLook.set(0, 1.3, 0); fov = 64;
  } else {
    vick.beginChase();
    step(75, 13);
    camPos.set(0, 3.1, 5.9); camLook.set(0, 1.3, 0); fov = 64;
  }

  var cam = new THREE.PerspectiveCamera(fov, W / H, 0.1, 600);
  cam.position.copy(camPos);
  cam.lookAt(camLook);
  renderer.render(scene, cam);

  document.title = 'vick scene=' + sceneId + ' state=' + vick.state +
    ' gap=' + vick.gap.toFixed(2) + ' x=' + vick.x.toFixed(2) +
    ' op=' + vick.opacity.toFixed(2) +
    ' smashed=' + player.smashed.toFixed(2) + ' deadT=' + player.deadT.toFixed(2);
  document.getElementById('info').textContent = (probeLog.length ? probeLog.join('\n') + '\n----\n' : '') + [
    'scene  = ' + sceneId,
    'state  = ' + vick.state + '   t=' + vick.t.toFixed(3),
    'gap    = ' + vick.gap.toFixed(3) + '   x=' + vick.x.toFixed(3) + '   side=' + vick.side,
    'opacity= ' + vick.opacity.toFixed(3) + '   blend=' + vick.blend.toFixed(3),
    'bodyRX = ' + vick.body.rotation.x.toFixed(3) + '   bodyRZ=' + vick.body.rotation.z.toFixed(3),
    'armR X = ' + vick.armR.rotation.x.toFixed(3) + '   armL X=' + vick.armL.rotation.x.toFixed(3),
    'head X = ' + vick.headGroup.rotation.x.toFixed(3),
    'player : x=' + player.x.toFixed(3) + ' y=' + player.y.toFixed(3) +
      ' dead=' + player.dead + ' smashed=' + player.smashed.toFixed(2) +
      ' deadT=' + player.deadT.toFixed(2),
    'pBodyY = ' + player.body.scale.y.toFixed(3) + '   rotX=' + player.body.rotation.x.toFixed(3),
    'camera : ' + camPos.x.toFixed(2) + ', ' + camPos.y.toFixed(2) + ', ' + camPos.z.toFixed(2) +
      '  -> ' + camLook.x.toFixed(2) + ', ' + camLook.y.toFixed(2) + ', ' + camLook.z.toFixed(2)
  ].join('\n');
})();
</script>
</body>
</html>
