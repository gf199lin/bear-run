<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>1T2R 竖直方向采集引导</title>
<style>
  :root{
    --bg:#080c12; --fg:#e8eef7; --dim:#7c8a9e; --line:#1b2431;
    --accent:#38bdf8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--fg);
    font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }
  header{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 26px; border-bottom:1px solid var(--line);
    font-size:14px; color:var(--dim); letter-spacing:.03em;
  }
  header b{color:var(--fg); font-weight:600; font-variant-numeric:tabular-nums}
  .chip{padding:3px 10px; border:1px solid var(--line); border-radius:999px; margin-left:8px}
  .banner{
    padding:10px 26px; font-size:14px; line-height:1.55;
    border-bottom:1px solid var(--line); background:#0d1420; color:var(--dim);
  }
  .banner b{color:var(--fg)}
  .banner.ok{background:#07231a; color:#86efac}
  .banner.warn{background:#241a05; color:#fcd34d}
  .banner.bad{background:#25090c; color:#fca5a5}
  main{
    flex:1; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:10px; min-height:0; padding:6px 0;
  }
  .ring{position:relative; width:min(34vh,250px); height:min(34vh,250px); flex:none}
  .ring svg{transform:rotate(-90deg); width:100%; height:100%}
  .ring .track{stroke:#141d29; stroke-width:9; fill:none}
  .ring .bar{stroke:var(--accent); stroke-width:9; fill:none;
    stroke-linecap:round; transition:stroke .25s}
  .ring .inner{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:2px;
  }
  .action{font-size:clamp(34px,5.4vh,72px); font-weight:800; line-height:1.05}
  .secs{font-size:clamp(18px,3vh,34px); font-weight:300; color:var(--dim);
    font-variant-numeric:tabular-nums}
  .hint{max-width:min(92vw,940px); text-align:center; font-size:clamp(14px,1.9vh,19px);
    color:var(--dim); line-height:1.55; padding:0 18px; min-height:2.4em}
  .plotbox{width:min(94vw,1000px); padding:0 10px}
  .plotbox canvas{width:100%; height:clamp(70px,13vh,130px); display:block;
    background:#0b121c; border:1px solid var(--line); border-radius:8px}
  footer{padding:10px 26px 16px; border-top:1px solid var(--line)}
  .bars{display:flex; align-items:flex-end; gap:5px; height:clamp(48px,8vh,84px); padding:0 2px}
  .bars div{flex:1; min-width:4px; border-radius:3px 3px 0 0;
    background:linear-gradient(180deg,var(--accent),#243244); height:2%;
    transition:height .09s linear}
  .bars div.peak{background:linear-gradient(180deg,#22c55e,#14532d)}
  .readout{display:flex; gap:22px; font-size:13px; color:var(--dim);
    margin-top:8px; font-variant-numeric:tabular-nums; flex-wrap:wrap}
  .readout b{color:var(--fg)}
  .err{position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
    color:#ef4444; font-size:14px; text-align:center; max-width:92vw}
  .done .action{color:#22c55e}
</style>
</head>
<body>
<header>
  <div>
    <b id="board">1T2R</b> <span class="chip" id="port">—</span>
    <span class="chip">第 <b id="round">0</b>/<b id="rounds">0</b> 轮</span>
    <span class="chip">段 <b id="prog">0/0</b></span>
  </div>
  <div>帧 <b id="frames">0</b> <span class="chip"><b id="fps">0</b> fps</span></div>
</header>

<div class="banner" id="banner">安装自检：等待开始</div>

<main id="main">
  <div class="ring">
    <svg viewBox="0 0 240 240">
      <circle class="track" cx="120" cy="120" r="110"></circle>
      <circle class="bar" id="bar" cx="120" cy="120" r="110"
              stroke-dasharray="691.15" stroke-dashoffset="691.15"></circle>
    </svg>
    <div class="inner">
      <div class="action" id="action">启动中</div>
      <div class="secs" id="secs">—</div>
    </div>
  </div>
  <div class="hint" id="hint">正在连接采集器…</div>
  <div class="plotbox">
    <div style="font-size:12px;color:#7c8a9e;padding:0 4px 4px">
      径向速度 v_r（最近 160 帧，单位 m/s，虚线 ±0.25 为判据门限）
    </div>
    <canvas id="plot"></canvas>
  </div>
</main>

<footer>
  <div class="bars" id="bars"></div>
  <div class="readout">
    <div>相位差 <b id="dphi">—</b> rad</div>
    <div>角度 <b id="ang">—</b>°</div>
    <div>径向速度 <b id="vr">—</b> m/s</div>
    <div>近 2s 峰值 <b id="vrpk" style="font-size:15px">—</b> m/s</div>
    <div>谱宽 <b id="dw">—</b> m/s</div>
    <div>活跃度 <b id="nz">—</b></div>
    <div>判定 <b id="act" class="act">—</b></div>
    <div>主 bin <b id="pk">—</b></div>
    <div>距离 <b id="rm">—</b> m</div>
    <div>带内能量 <b id="bs">—</b> %</div>
    <div>bin 宽 <b id="bw">—</b> m</div>
  </div>
</footer>
<div class="err" id="err"></div>

<script>
const C = 2 * Math.PI * 110;
const PHASE = {
  boot:   {color:'#64748b', word:'启动中'},
  prep:   {color:'#38bdf8', word:'准备'},
  check:  {color:'#f59e0b', word:'自检'},
  base:   {color:'#64748b', word:'站好'},
  jump:   {color:'#22c55e', word:'跳'},
  duck:   {color:'#a855f7', word:'蹲'},
  walk:   {color:'#f97316', word:'原地踏步'},
  bend:   {color:'#f59e0b', word:'弯腰'},
  turn:   {color:'#eab308', word:'转身'},
  left:   {color:'#06b6d4', word:'左移'},
  right:  {color:'#0ea5e9', word:'右移'},
  combo:  {color:'#22c55e', word:'连续动作'},
  move:   {color:'#38bdf8', word:'换位置'},
  done:   {color:'#22c55e', word:'完成'}
};

const el = id => document.getElementById(id);
let barsN = 0;

function ensureBars(n) {
  if (n === barsN) return;
  barsN = n;
  const box = el('bars');
  box.innerHTML = '';
  for (let i = 0; i < n; i++) box.appendChild(document.createElement('div'));
}

function drawPlot(hist) {
  const cv = el('plot');
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
  }
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);

  const n = hist.length;
  if (n < 2) return;
  let lo = -0.8, hi = 0.8;
  for (const v of hist) { if (v < lo) lo = v; if (v > hi) hi = v; }
  const pad = Math.max(0.1, (hi - lo) * 0.12);
  lo -= pad; hi += pad;
  const X = i => (i / (n - 1)) * (w - 16) + 8;
  const Y = v => h - 6 - ((v - lo) / (hi - lo)) * (h - 12);

  // 零线
  g.strokeStyle = '#1f2d3d'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(8, Y(0)); g.lineTo(w - 8, Y(0)); g.stroke();

  // ±0.25 m/s 判据门限
  const th = 0.25;
  g.strokeStyle = 'rgba(245,158,11,.35)';
  g.setLineDash([4, 4]);
  for (const s of [th, -th]) {
    g.beginPath(); g.moveTo(8, Y(s)); g.lineTo(w - 8, Y(s)); g.stroke();
  }
  g.setLineDash([]);

  // 曲线
  g.strokeStyle = '#38bdf8'; g.lineWidth = 2;
  g.lineJoin = 'round';
  g.beginPath();
  for (let i = 0; i < n; i++) {
    const x = X(i), y = Y(hist[i]);
    if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
  }
  g.stroke();

  // 最新点
  const lx = X(n - 1), ly = Y(hist[n - 1]);
  g.fillStyle = '#38bdf8';
  g.beginPath(); g.arc(lx, ly, 3.2, 0, Math.PI * 2); g.fill();
}

function paint(s) {
  const ph = PHASE[s.phase] || PHASE.boot;
  document.documentElement.style.setProperty('--accent', ph.color);

  el('action').textContent = s.done ? '完成' : (ph.word || '进行中');
  const remain = s.remain || 0, dur = s.dur || 0;
  el('secs').textContent = s.done ? '已结束' : (dur > 0 ? remain.toFixed(1) + ' s' : '—');
  const frac = dur > 0 ? Math.max(0, Math.min(1, remain / dur)) : 0;
  el('bar').setAttribute('stroke-dashoffset', String(C * (1 - frac)));

  el('hint').textContent = s.text || '';
  el('port').textContent = s.port || '—';
  el('round').textContent = s.round || 0;
  el('rounds').textContent = s.rounds || 0;
  el('prog').textContent = (s.seg_no || 0) + '/' + (s.seg_total || 0);
  el('frames').textContent = s.frames || 0;
  el('fps').textContent = s.fps || 0;
  el('bw').textContent = s.bin_width ? s.bin_width.toFixed(3) : '—';

  const bn = el('banner');
  bn.className = 'banner' + (s.check_status && s.check_status !== 'pending'
                             ? ' ' + s.check_status : '');
  bn.innerHTML = '<b>采集进度</b> · ' + (s.check_text || '等待开始') +
                 (s.axis && s.axis !== 'unknown' ? '（基线判定：' + s.axis + '）' : '');

  const e = s.energy || [];
  ensureBars(e.length);
  const kids = el('bars').children;
  const pkIdx = s.peak_bin;
  for (let i = 0; i < e.length; i++) {
    kids[i].style.height = Math.max(2, e[i]) + '%';
    kids[i].classList.toggle('peak', i === pkIdx);
  }
  el('pk').textContent = (pkIdx >= 0) ? pkIdx : '—';
  el('rm').textContent = s.range_m ? s.range_m.toFixed(2) : '—';
  el('dphi').textContent = (s.dphi === 0 && !s.frames) ? '—' : (s.dphi || 0).toFixed(2);
  el('ang').textContent = (s.angle_deg === 0 && !s.frames) ? '—' : (s.angle_deg || 0).toFixed(1);
  el('vr').textContent = (s.v_r === 0 && !s.frames) ? '—' : (s.v_r || 0).toFixed(2);
  el('vrpk').textContent = s.frames
    ? ((s.vr_up || 0).toFixed(2) + ' / ' + (s.vr_dn || 0).toFixed(2)) : '—';
  el('bs').textContent = s.band_share || 0;
  if (s.doppler_width !== undefined) {
    el('dw').textContent = (s.doppler_width || 0).toFixed(3);
  }
  if (s.nz_share !== undefined) {
    el('nz').textContent = ((s.nz_share || 0) * 100).toFixed(0) + '%';
  }
  const act = document.getElementById('act');
  if (act) {
    const label = s.action ? (s.action === 'JUMP' ? '跳 JUMP' : '蹲 DUCK') : '';
    act.textContent = label || '—';
    act.className = s.action ? 'act ' + s.action.toLowerCase() : 'act';
  }

  drawPlot(s.hist || []);

  el('err').textContent = s.err || '';
  document.body.classList.toggle('done', !!s.done);
}

async function loop() {
  try {
    const r = await fetch('/state', {cache: 'no-store'});
    paint(await r.json());
  } catch (e) {
    el('hint').textContent = '与采集器的连接已断开（采集可能已结束）';
  }
  setTimeout(loop, 120);
}
loop();
window.addEventListener('resize', () => { const l = el('plot'); l.width = 0; });
</script>
</body>
</html>
