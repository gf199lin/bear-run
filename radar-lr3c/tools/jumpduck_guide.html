<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>跳 / 蹲采集引导</title>
<style>
  :root{
    --bg:#0a0e14; --fg:#e6edf6; --dim:#7c8a9e; --line:#1c2634;
    --accent:#f59e0b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--fg);
    font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
    transition:background .25s;
  }
  header{
    display:flex; justify-content:space-between; align-items:center;
    padding:18px 28px; border-bottom:1px solid var(--line);
    font-size:15px; color:var(--dim); letter-spacing:.03em;
  }
  header b{color:var(--fg); font-weight:600; font-variant-numeric:tabular-nums}
  .chip{padding:3px 10px; border:1px solid var(--line); border-radius:999px; margin-left:8px}
  main{
    flex:1; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:14px; position:relative; min-height:0;
  }
  .ring{position:relative; width:min(44vh,330px); height:min(44vh,330px); flex:none}
  .ring svg{transform:rotate(-90deg); width:100%; height:100%}
  .ring .track{stroke:#16202d; stroke-width:10; fill:none}
  .ring .bar{stroke:var(--accent); stroke-width:10; fill:none;
    stroke-linecap:round; transition:stroke .25s}
  .ring .inner{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:4px;
  }
  .action{font-size:clamp(44px,7.4vh,100px); font-weight:800; letter-spacing:.02em;
    line-height:1; transition:color .25s}
  .secs{font-size:clamp(24px,4vh,48px); font-weight:300; color:var(--dim);
    font-variant-numeric:tabular-nums}
  .hint{
    max-width:min(90vw,900px); text-align:center; font-size:clamp(15px,2vh,21px);
    color:var(--dim); line-height:1.6; padding:0 20px; min-height:2.6em;
  }
  .hint b{color:var(--fg); font-weight:600}
  footer{padding:14px 28px 20px; border-top:1px solid var(--line)}
  .bars{
    display:flex; align-items:flex-end; gap:5px; height:clamp(64px,11vh,110px);
    padding:0 2px;
  }
  .bars div{
    flex:1; min-width:4px; border-radius:3px 3px 0 0;
    background:linear-gradient(180deg,var(--accent),#334155);
    height:2%; transition:height .09s linear;
  }
  .bars div.peak{background:linear-gradient(180deg,#22c55e,#166534)}
  .readout{display:flex; gap:26px; font-size:14px; color:var(--dim);
    margin-top:10px; font-variant-numeric:tabular-nums; flex-wrap:wrap}
  .readout b{color:var(--fg)}
  .ok{color:#22c55e !important}
  .bad{color:#ef4444 !important}
  .err{position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
    color:#ef4444; font-size:15px; text-align:center}
  .done .action{color:#22c55e}
</style>
</head>
<body>
<header>
  <div>
    2T4R <b id="profile">—</b>
    <span class="chip">第 <b id="round">0</b>/<b id="rounds">0</b> 轮</span>
    <span class="chip">段 <b id="prog">0/0</b></span>
  </div>
  <div>帧 <b id="frames">0</b> <span class="chip"><b id="fps">0</b> fps</span></div>
</header>

<main id="main">
  <div class="ring">
    <svg viewBox="0 0 240 240">
      <circle class="track" cx="120" cy="120" r="110"></circle>
      <circle class="bar" id="bar" cx="120" cy="120" r="110"
              stroke-dasharray="691.15" stroke-dashoffset="691.15"></circle>
    </svg>
    <div class="inner">
      <div class="action" id="action">启动中</div>
      <div class="secs" id="secs">—</div>
    </div>
  </div>
  <div class="hint" id="hint">正在连接采集器…</div>
</main>

<footer>
  <div class="bars" id="bars"></div>
  <div class="readout">
    <div>峰值 bin <b id="pk">—</b></div>
    <div>距离 <b id="rm">—</b> m</div>
    <div>bin 宽 <b id="bw">—</b> m</div>
    <div>动作强度 <b id="lvl">—</b></div>
  </div>
</footer>
<div class="err" id="err"></div>

<script>
const C = 2 * Math.PI * 110;
const PHASE = {
  boot: {color:'#64748b', word:'启动中'},
  prep: {color:'#f59e0b', word:'准备'},
  base: {color:'#64748b', word:'站好'},
  jump: {color:'#22c55e', word:'跳'},
  duck: {color:'#a855f7', word:'蹲'},
  rest: {color:'#a855f7', word:'休息'},
  done: {color:'#22c55e', word:'完成'}
};

const el = id => document.getElementById(id);
let barsN = 0;

function ensureBars(n) {
  if (n === barsN) return;
  barsN = n;
  const box = el('bars');
  box.innerHTML = '';
  for (let i = 0; i < n; i++) box.appendChild(document.createElement('div'));
}

function paint(s) {
  const ph = PHASE[s.phase] || PHASE.boot;
  document.documentElement.style.setProperty('--accent', ph.color);

  el('action').textContent = s.done ? '完成' : (ph.word || '进行中');
  const remain = s.remain || 0;
  const dur = s.dur || 0;
  el('secs').textContent = s.done ? '已完成' : (dur > 0 ? remain.toFixed(1) + ' s' : '—');
  const frac = dur > 0 ? Math.max(0, Math.min(1, remain / dur)) : 0;
  el('bar').setAttribute('stroke-dashoffset', String(C * (1 - frac)));

  el('hint').textContent = s.text || '';
  el('profile').textContent = s.profile || '—';
  el('round').textContent = s.round || 0;
  el('rounds').textContent = s.rounds || 0;
  el('prog').textContent = (s.seg_no || 0) + '/' + (s.seg_total || 0);
  el('frames').textContent = s.frames || 0;
  el('fps').textContent = s.fps || 0;
  el('bw').textContent = s.bin_width ? s.bin_width.toFixed(3) : '—';

  const e = s.energy || [];
  ensureBars(e.length);
  const kids = el('bars').children;
  const pkIdx = s.peak_bin;
  let sum = 0;
  for (let i = 0; i < e.length; i++) {
    kids[i].style.height = Math.max(2, e[i]) + '%';
    kids[i].classList.toggle('peak', i === pkIdx);
    sum += e[i];
  }
  el('pk').textContent = (pkIdx >= 0) ? pkIdx : '—';
  el('rm').textContent = s.range_m ? s.range_m.toFixed(2) : '—';
  el('lvl').textContent = e.length ? Math.round(sum / e.length) : '—';

  el('err').textContent = s.err || '';
  document.body.classList.toggle('done', !!s.done);
}

async function loop() {
  try {
    const r = await fetch('/state', {cache: 'no-store'});
    paint(await r.json());
  } catch (e) {
    el('hint').textContent = '与采集器的连接已断开（采集可能已结束）';
  }
  setTimeout(loop, 120);
}
loop();
</script>
</body>
</html>
